<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1B2B">
<title>Softia — Gerador de Licenças</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    color-scheme: light dark;
    --bg:#f4f6f8; --card:#fff; --fg:#16202b; --mut:#5d6b7a; --line:#dde3ea;
    --ac:#0d6efd; --ok:#0f7b3f; --warn:#a35b00; --err:#c0392b;
    --noite:#0B1B2B; --ouro:#D4A537;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1620; --card:#17202c; --fg:#e6edf5; --mut:#93a3b5; --line:#2a3745;
            --ac:#4d9dff; --ok:#4ec27f; --warn:#e0a44a; --err:#ff6b5a; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; padding:16px 16px 40px; background:var(--bg); color:var(--fg);
         font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:640px; margin:0 auto; }
  header { display:flex; align-items:center; gap:10px; margin-bottom:4px; }
  .logo { width:34px; height:34px; border-radius:9px; background:var(--noite); color:var(--ouro);
          display:grid; place-items:center; font-weight:700; font-size:18px; flex:none; }
  h1 { font-size:1.15rem; margin:0; }
  .sub { color:var(--mut); font-size:.82rem; margin:2px 0 18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  label { display:block; font-size:.78rem; font-weight:600; text-transform:uppercase;
          letter-spacing:.04em; color:var(--mut); margin:14px 0 6px; }
  label:first-child { margin-top:0; }
  input, select, textarea { width:100%; padding:12px; font:inherit; color:var(--fg);
          background:var(--bg); border:1px solid var(--line); border-radius:10px; }
  textarea { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.78rem; resize:vertical; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--ac); outline-offset:1px; border-color:var(--ac); }
  button { width:100%; margin-top:14px; padding:14px; font:inherit; font-weight:600; color:#fff;
           background:var(--ac); border:0; border-radius:10px; cursor:pointer; }
  button:active { filter:brightness(.92); }
  button.sec { background:transparent; color:var(--ac); border:1px solid var(--line); margin-top:8px; }
  button.zap { background:#25D366; }
  .row { display:flex; gap:12px; }
  .row > div { flex:1; }
  .tabs { display:flex; gap:8px; margin-bottom:14px; }
  .tabs button { margin:0; padding:12px 10px; background:var(--card); color:var(--mut);
                 border:1px solid var(--line); font-size:.9rem; }
  .tabs button[aria-pressed="true"] { background:var(--noite); color:#fff; border-color:var(--noite); }
  .out { display:none; }
  .out.on { display:block; }
  .key { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.78rem; word-break:break-all;
         background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:12px; margin-top:8px;
         max-height:150px; overflow:auto; }
  .meta { font-size:.85rem; color:var(--mut); margin-top:10px; }
  .meta b { color:var(--fg); font-weight:600; }
  .err { color:var(--err); font-size:.9rem; margin-top:12px; }
  .ok { color:var(--ok); font-size:.85rem; margin-top:8px; }
  .note { font-size:.78rem; color:var(--warn); border-left:3px solid var(--warn); padding-left:10px; margin-top:14px; }
  details summary { cursor:pointer; font-size:.85rem; color:var(--mut); font-weight:600; }
  #cam { display:none; margin-top:12px; }
  #cam.on { display:block; }
  #video { width:100%; border-radius:12px; background:#000; aspect-ratio:1; object-fit:cover; }
  .hist { font-size:.82rem; }
  .hist li { padding:9px 0; border-bottom:1px solid var(--line); list-style:none; }
  .hist li:last-child { border-bottom:0; }
  .hist ul { padding:0; margin:8px 0 0; }
  .hist .quando { color:var(--mut); font-size:.75rem; }
  .hist code { font-size:.72rem; color:var(--mut); word-break:break-all; }
  .hist button { width:auto; margin:6px 6px 0 0; padding:7px 12px; font-size:.78rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">S</div>
    <div>
      <h1>Gerador de Licenças</h1>
      <p class="sub" style="margin:0">Softia · funciona offline · nada sai deste aparelho</p>
    </div>
  </header>

  <div class="tabs" id="tabs">
    <button type="button" data-p="aquagest" aria-pressed="true">AquaGest</button>
    <button type="button" data-p="gymgest" aria-pressed="false">GymGest</button>
  </div>

  <div class="card">
    <details id="dk">
      <summary>🔑 Chave privada do <span class="nomeProduto">AquaGest</span> (colar uma vez)</summary>
      <label for="pk">Conteúdo de private-key.pem</label>
      <textarea id="pk" rows="4" placeholder="-----BEGIN PRIVATE KEY-----&#10;...&#10;-----END PRIVATE KEY-----"
                autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
      <button class="sec" id="salvar">Salvar neste aparelho</button>
      <button class="sec" id="apagar">Apagar deste aparelho</button>
      <div id="pkst" class="ok"></div>
      <p class="note">A chave fica só neste navegador e é conferida contra o produto certo.
        Quem tiver este texto consegue emitir licenças — não repasse.</p>
    </details>
  </div>

  <div class="card">
    <label for="hw">Hardware ID do cliente</label>
    <input id="hw" placeholder="cole o ID ou leia o QR da tela" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button type="button" class="sec" id="lerqr">📷 Ler QR da tela do cliente</button>
    <div id="cam">
      <video id="video" playsinline muted></video>
      <button type="button" class="sec" id="fecharcam">Fechar câmera</button>
    </div>

    <div class="row">
      <div>
        <label for="plano">Plano</label>
        <select id="plano">
          <option value="basico">Básico — 1 máq. / 2 usu.</option>
          <option value="profissional" selected>Profissional — 3 máq. / 5 usu.</option>
          <option value="premium">Premium — ilimitado</option>
          <option value="trial">Teste — 14 dias</option>
        </select>
      </div>
      <div>
        <label for="dias">Validade (dias)</label>
        <input id="dias" type="number" inputmode="numeric" value="365">
      </div>
    </div>

    <button id="gerar">Gerar chave</button>
    <div id="erro" class="err"></div>
  </div>

  <div class="card out" id="out">
    <label>Chave — envie esta string ao cliente</label>
    <div class="key" id="chave"></div>
    <button class="sec" id="copiar">Copiar chave</button>
    <button class="zap" id="enviar">Enviar por WhatsApp</button>
    <div class="meta" id="meta"></div>
  </div>

  <div class="card hist">
    <details id="dh">
      <summary>🗂 Chaves emitidas (<span id="qtd">0</span>)</summary>
      <ul id="lista"></ul>
      <button class="sec" id="limpar">Limpar histórico</button>
    </details>
  </div>
</div>

<script>
"use strict";

/* ---------- SHA-512 (JS puro, BigInt) ---------- */
const M64 = (1n << 64n) - 1n;
const KK = ['428a2f98d728ae22','7137449123ef65cd','b5c0fbcfec4d3b2f','e9b5dba58189dbbc','3956c25bf348b538','59f111f1b605d019','923f82a4af194f9b','ab1c5ed5da6d8118','d807aa98a3030242','12835b0145706fbe','243185be4ee4b28c','550c7dc3d5ffb4e2','72be5d74f27b896f','80deb1fe3b1696b1','9bdc06a725c71235','c19bf174cf692694','e49b69c19ef14ad2','efbe4786384f25e3','0fc19dc68b8cd5b5','240ca1cc77ac9c65','2de92c6f592b0275','4a7484aa6ea6e483','5cb0a9dcbd41fbd4','76f988da831153b5','983e5152ee66dfab','a831c66d2db43210','b00327c898fb213f','bf597fc7beef0ee4','c6e00bf33da88fc2','d5a79147930aa725','06ca6351e003826f','142929670a0e6e70','27b70a8546d22ffc','2e1b21385c26c926','4d2c6dfc5ac42aed','53380d139d95b3df','650a73548baf63de','766a0abb3c77b2a8','81c2c92e47edaee6','92722c851482353b','a2bfe8a14cf10364','a81a664bbc423001','c24b8b70d0f89791','c76c51a30654be30','d192e819d6ef5218','d69906245565a910','f40e35855771202a','106aa07032bbd1b8','19a4c116b8d2d0c8','1e376c085141ab53','2748774cdf8eeb99','34b0bcb5e19b48a8','391c0cb3c5c95a63','4ed8aa4ae3418acb','5b9cca4f7763e373','682e6ff3d6b2b8a3','748f82ee5defb2fc','78a5636f43172f60','84c87814a1f0ab72','8cc702081a6439ec','90befffa23631e28','a4506cebde82bde9','bef9a3f7b2c67915','c67178f2e372532b','ca273eceea26619c','d186b8c721c0c207','eada7dd6cde0eb1e','f57d4f7fee6ed178','06f067aa72176fba','0a637dc5a2c898a6','113f9804bef90dae','1b710b35131c471b','28db77f523047d84','32caab7b40c72493','3c9ebe0a15c9bebc','431d67c49c100d4c','4cc5d4becb3e42b6','597f299cfc657e2a','5fcb6fab3ad6faec','6c44198c4a475817'].map(h => BigInt('0x' + h));
const H0 = ['6a09e667f3bcc908','bb67ae8584caa73b','3c6ef372fe94f82b','a54ff53a5f1d36f1','510e527fade682d1','9b05688c2b3e6c1f','1f83d9abfb41bd6b','5be0cd19137e2179'].map(h => BigInt('0x' + h));
const rotr = (x, n) => ((x >> n) | (x << (64n - n))) & M64;

function sha512(msg) {
  const len = msg.length;
  const bitLen = BigInt(len) * 8n;
  const padLen = ((len + 17 + 127) & ~127) - len;
  const buf = new Uint8Array(len + padLen);
  buf.set(msg); buf[len] = 0x80;
  let bl = bitLen;
  for (let i = buf.length - 1; i >= buf.length - 16; i--) { buf[i] = Number(bl & 255n); bl >>= 8n; }
  const H = H0.slice(), w = new Array(80);
  for (let off = 0; off < buf.length; off += 128) {
    for (let i = 0; i < 16; i++) {
      let v = 0n;
      for (let j = 0; j < 8; j++) v = (v << 8n) | BigInt(buf[off + i * 8 + j]);
      w[i] = v;
    }
    for (let i = 16; i < 80; i++) {
      const s0 = rotr(w[i-15],1n) ^ rotr(w[i-15],8n) ^ (w[i-15] >> 7n);
      const s1 = rotr(w[i-2],19n) ^ rotr(w[i-2],61n) ^ (w[i-2] >> 6n);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) & M64;
    }
    let [a,b,c,d,e,f,g,h] = H;
    for (let i = 0; i < 80; i++) {
      const S1 = rotr(e,14n) ^ rotr(e,18n) ^ rotr(e,41n);
      const ch = (e & f) ^ (~e & M64 & g);
      const t1 = (h + S1 + ch + KK[i] + w[i]) & M64;
      const S0 = rotr(a,28n) ^ rotr(a,34n) ^ rotr(a,39n);
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + maj) & M64;
      h=g; g=f; f=e; e=(d+t1)&M64; d=c; c=b; b=a; a=(t1+t2)&M64;
    }
    const v = [a,b,c,d,e,f,g,h];
    for (let i = 0; i < 8; i++) H[i] = (H[i] + v[i]) & M64;
  }
  const out = new Uint8Array(64);
  for (let i = 0; i < 8; i++) { let v = H[i]; for (let j = 7; j >= 0; j--) { out[i*8+j] = Number(v & 255n); v >>= 8n; } }
  return out;
}

/* ---------- Ed25519 (assinatura) ---------- */
const P = (1n << 255n) - 19n;
const L = 2n ** 252n + 27742317777372353535851937790883648493n;
const mod = (a, m = P) => { const r = a % m; return r >= 0n ? r : r + m; };
function pow(b, e, m = P) { let r = 1n; b = mod(b, m); while (e > 0n) { if (e & 1n) r = r * b % m; b = b * b % m; e >>= 1n; } return r; }
const inv = (a, m = P) => pow(a, m - 2n, m);
const D = mod(-121665n * inv(121666n));
const I = pow(2n, (P - 1n) / 4n);

function add(p, q) {
  const [X1,Y1,Z1,T1] = p, [X2,Y2,Z2,T2] = q;
  const A = mod((Y1 - X1) * (Y2 - X2)), B = mod((Y1 + X1) * (Y2 + X2));
  const C = mod(T1 * 2n * D * T2), Dd = mod(Z1 * 2n * Z2);
  const E = B - A, F = Dd - C, G2 = Dd + C, H = B + A;
  return [mod(E * F), mod(G2 * H), mod(F * G2), mod(E * H)];
}
function scalarMul(p, k) {
  let q = [0n, 1n, 1n, 0n];
  while (k > 0n) { if (k & 1n) q = add(q, p); p = add(p, p); k >>= 1n; }
  return q;
}
function recoverX(y, sign) {
  const y2 = mod(y * y);
  const t = mod(mod(y2 - 1n) * inv(mod(D * y2 + 1n)));
  let x = pow(t, (P + 3n) / 8n);
  if (mod(x * x - t) !== 0n) x = mod(x * I);
  if (mod(x * x - t) !== 0n) throw new Error('ponto inválido');
  if ((x & 1n) !== sign) x = mod(-x);
  return x;
}
const Gy = mod(4n * inv(5n)), Gx = recoverX(Gy, 0n);
const G = [Gx, Gy, 1n, mod(Gx * Gy)];

function encodePoint(p) {
  const zi = inv(p[2]);
  const x = mod(p[0] * zi); let y = mod(p[1] * zi);
  const out = new Uint8Array(32);
  for (let i = 0; i < 32; i++) { out[i] = Number(y & 255n); y >>= 8n; }
  out[31] |= Number(x & 1n) << 7;
  return out;
}
const toBigLE = b => { let n = 0n; for (let i = b.length - 1; i >= 0; i--) n = (n << 8n) | BigInt(b[i]); return n; };
const toBytesLE = (n, len) => { const o = new Uint8Array(len); for (let i = 0; i < len; i++) { o[i] = Number(n & 255n); n >>= 8n; } return o; };
function concat(...arrs) { const o = new Uint8Array(arrs.reduce((s,a) => s + a.length, 0)); let i = 0; for (const a of arrs) { o.set(a, i); i += a.length; } return o; }

function sign(message, seed) {
  const h = sha512(seed);
  const a = h.slice(0, 32);
  a[0] &= 248; a[31] &= 127; a[31] |= 64;
  const s = toBigLE(a), prefix = h.slice(32);
  const A = encodePoint(scalarMul(G, s));
  const r = mod(toBigLE(sha512(concat(prefix, message))), L);
  const R = encodePoint(scalarMul(G, r));
  const k = mod(toBigLE(sha512(concat(R, A, message))), L);
  return concat(R, toBytesLE(mod(r + k * s, L), 32));
}

function seedFromPem(pem) {
  const b64 = pem.replace(/-----[^-]+-----/g, '').replace(/\s+/g, '');
  if (!b64) throw new Error('Chave privada vazia.');
  let der;
  try { der = Uint8Array.from(atob(b64), c => c.charCodeAt(0)); }
  catch { throw new Error('Chave privada não é um PEM válido.'); }
  if (der.length < 48) throw new Error('Chave privada com tamanho inesperado — confira se é a private-key.pem do AquaGest.');
  return der.slice(der.length - 32); // PKCS#8 Ed25519: header + 32 bytes de seed
}

/* ---------- Produtos ---------- */
// A pública esperada de cada app (mesma que está embutida em electron/modules/licensing.js).
// Serve para recusar na hora a chave privada colada no produto errado — erro que só
// apareceria depois, na frente do cliente, como "assinatura não confere".
const PRODUTOS = {
  aquagest: {
    nome: 'AquaGest',
    pub: 'MCowBQYDK2VwAyEAn60JbGJLk11UVSNSjULPXrU8pbZaNfRRvlfFmyWEimI=',
    planos: {
      basico:       { nome: 'AquaGest Básico',       maquinas: 1,  usuarios: 2,  dias: 365 },
      profissional: { nome: 'AquaGest Profissional', maquinas: 3,  usuarios: 5,  dias: 365 },
      premium:      { nome: 'AquaGest Premium',      maquinas: 99, usuarios: 99, dias: 365 },
      trial:        { nome: 'Teste',                 maquinas: 1,  usuarios: 2,  dias: 14 },
    },
  },
  gymgest: {
    nome: 'GymGest',
    pub: 'MCowBQYDK2VwAyEAES2FqSNRfIuHCb3/loNy2jGo7xXOZVipeZYlPDsowds=',
    planos: {
      basico:       { nome: 'GymGest Básico',       maquinas: 1,  usuarios: 2,  dias: 365 },
      profissional: { nome: 'GymGest Profissional', maquinas: 3,  usuarios: 5,  dias: 365 },
      premium:      { nome: 'GymGest Premium',      maquinas: 99, usuarios: 99, dias: 365 },
      trial:        { nome: 'Teste',                nome_curto: 'Teste', maquinas: 1, usuarios: 2, dias: 14 },
    },
  },
};

const b64url = b => btoa(String.fromCharCode(...b)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const $ = id => document.getElementById(id);

/** Chave pública (DER base64) derivada da privada — para conferir o produto. */
function pubFromSeed(seed) {
  const h = sha512(seed);
  const a = h.slice(0, 32);
  a[0] &= 248; a[31] &= 127; a[31] |= 64;
  const raw = encodePoint(scalarMul(G, toBigLE(a)));
  const der = concat(new Uint8Array([0x30,0x2a,0x30,0x05,0x06,0x03,0x2b,0x65,0x70,0x03,0x21,0x00]), raw);
  return btoa(String.fromCharCode(...der));
}

/* ---------- Estado ---------- */
let produto = 'aquagest';
const chavePK = p => 'softia_pk_' + p;
const STORE_HIST = 'softia_hist';

function setProduto(p) {
  produto = p;
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.p === p)));
  document.querySelectorAll('.nomeProduto').forEach(e => { e.textContent = PRODUTOS[p].nome; });
  const sel = $('plano');
  [...sel.options].forEach(o => {
    const pl = PRODUTOS[p].planos[o.value];
    const rotulo = o.value === 'trial' ? 'Teste — 14 dias'
      : `${pl.nome.replace(PRODUTOS[p].nome + ' ', '')} — ${pl.maquinas > 90 ? 'ilimitado' : pl.maquinas + ' máq.'}`;
    o.textContent = rotulo;
  });
  marcarChave();
}

function marcarChave() {
  const tem = !!localStorage.getItem(chavePK(produto));
  $('pkst').textContent = tem ? `✓ chave do ${PRODUTOS[produto].nome} salva neste aparelho` : '';
  $('pk').value = tem ? localStorage.getItem(chavePK(produto)) : '';
  if (!tem) $('dk').open = true;
}

$('tabs').onclick = e => {
  const b = e.target.closest('button[data-p]');
  if (b) { setProduto(b.dataset.p); $('erro').textContent = ''; $('out').classList.remove('on'); }
};

$('salvar').onclick = () => {
  try {
    const seed = seedFromPem($('pk').value);
    const pub = pubFromSeed(seed);
    if (pub !== PRODUTOS[produto].pub) {
      const outro = Object.values(PRODUTOS).find(x => x.pub === pub);
      throw new Error(outro
        ? `Esta é a chave privada do ${outro.nome}, não do ${PRODUTOS[produto].nome}.`
        : `Esta chave não corresponde ao ${PRODUTOS[produto].nome}.`);
    }
  } catch (e) { $('pkst').textContent = '✗ ' + e.message; return; }
  localStorage.setItem(chavePK(produto), $('pk').value.trim());
  marcarChave();
  $('dk').open = false;
};
$('apagar').onclick = () => { localStorage.removeItem(chavePK(produto)); marcarChave(); };

$('plano').onchange = () => { $('dias').value = PRODUTOS[produto].planos[$('plano').value].dias; };

/* ---------- Leitor de QR ---------- */
let stream = null, lendo = false;

function extrairHwid(texto) {
  // Espaços entram fácil: o ID aparece agrupado em blocos na tela do cliente e
  // costuma ser digitado/colado assim. Maiúsculas idem — o app compara o hex em
  // minúsculas, então normalizar aqui evita emitir chave que não ativa em lugar nenhum.
  const t = String(texto || '').replace(/\s+/g, '').toLowerCase();
  const m = t.match(/[?&]hw=([0-9a-f]{32,128})/i);
  if (m) {
    const p = t.match(/[?&]p=([a-z]+)/i);
    if (p && PRODUTOS[p[1].toLowerCase()]) setProduto(p[1].toLowerCase());
    return m[1];
  }
  const h = t.match(/^[0-9a-f]{32,128}$/i);
  return h ? h[0] : null;
}

$('lerqr').onclick = async () => {
  $('erro').textContent = '';
  if (!('BarcodeDetector' in window)) {
    $('erro').textContent = 'Este navegador não lê QR. Use o Chrome, ou copie o ID e cole no campo acima.';
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  } catch {
    $('erro').textContent = 'Não consegui abrir a câmera. Autorize o acesso ou cole o ID manualmente.';
    return;
  }
  $('cam').classList.add('on');
  const video = $('video');
  video.srcObject = stream;
  await video.play();
  const det = new BarcodeDetector({ formats: ['qr_code'] });
  lendo = true;
  const loop = async () => {
    if (!lendo) return;
    try {
      const codes = await det.detect(video);
      for (const c of codes) {
        const hw = extrairHwid(c.rawValue);
        if (hw) {
          $('hw').value = hw;
          if (navigator.vibrate) navigator.vibrate(60);
          fecharCam();
          return;
        }
      }
    } catch { /* frame ruim, tenta o próximo */ }
    requestAnimationFrame(loop);
  };
  loop();
};

function fecharCam() {
  lendo = false;
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  $('cam').classList.remove('on');
}
$('fecharcam').onclick = fecharCam;

/* ---------- Geração ---------- */
let ultima = null;

$('gerar').onclick = () => {
  $('erro').textContent = ''; $('out').classList.remove('on');
  try {
    const hwid = extrairHwid($('hw').value) || $('hw').value.replace(/\s+/g, '').toLowerCase();
    if (!hwid) throw new Error('Informe o Hardware ID do cliente.');
    if (!/^[0-9a-f]{32,128}$/.test(hwid)) {
      throw new Error('O Hardware ID deve ter só números e letras de a a f. Confira a cópia — se leu de uma foto, use o QR ou peça o ID pelo WhatsApp.');
    }
    $('hw').value = hwid; // devolve normalizado, para conferir com o que o cliente vê

    const planoId = $('plano').value;
    const plano = PRODUTOS[produto].planos[planoId];
    const dias = parseInt($('dias').value, 10);
    if (!dias || dias < 1) throw new Error('Validade em dias inválida.');

    const pem = localStorage.getItem(chavePK(produto)) || $('pk').value;
    if (!pem) throw new Error(`Cole a chave privada do ${PRODUTOS[produto].nome} lá em cima (uma vez só).`);
    const seed = seedFromPem(pem);
    if (pubFromSeed(seed) !== PRODUTOS[produto].pub) {
      throw new Error(`A chave privada salva não é a do ${PRODUTOS[produto].nome}.`);
    }

    const exp = new Date(Date.now() + dias * 24 * 3600 * 1000).toISOString();
    const payload = JSON.stringify({ hwid, plano: planoId, exp, maq: plano.maquinas, usr: plano.usuarios });
    const msg = new TextEncoder().encode(payload);
    const chave = b64url(msg) + '.' + b64url(sign(msg, seed));

    ultima = { chave, produto, produtoNome: PRODUTOS[produto].nome, hwid, plano: plano.nome, exp, dias, em: new Date().toISOString() };
    $('chave').textContent = chave;
    $('meta').innerHTML = `<b>${plano.nome}</b> — ${plano.maquinas > 90 ? 'ilimitado' : plano.maquinas + ' máq.'} / ` +
      `${plano.usuarios > 90 ? 'ilimitado' : plano.usuarios + ' usuários'}<br>` +
      `Máquina: <b>…${hwid.slice(-8)}</b><br>` +
      `Expira em <b>${new Date(exp).toLocaleDateString('pt-BR')}</b> (${dias} dias)`;
    $('out').classList.add('on');
    salvarHistorico(ultima);
    $('out').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  } catch (e) {
    $('erro').textContent = e.message;
  }
};

$('copiar').onclick = () => copiar($('chave').textContent, $('copiar'));

async function copiar(texto, botao) {
  const rotulo = botao.textContent;
  try { await navigator.clipboard.writeText(texto); botao.textContent = '✓ Copiada'; }
  catch {
    const ta = document.createElement('textarea');
    ta.value = texto; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); botao.textContent = '✓ Copiada'; }
    catch { botao.textContent = 'Copie manualmente'; }
    ta.remove();
  }
  setTimeout(() => { botao.textContent = rotulo; }, 2200);
}

$('enviar').onclick = () => {
  if (!ultima) return;
  const texto =
    `Chave de licença do ${ultima.produtoNome}\n` +
    `Plano: ${ultima.plano}\n` +
    `Válida até ${new Date(ultima.exp).toLocaleDateString('pt-BR')}\n\n` +
    `${ultima.chave}\n\n` +
    `Cole no campo "Chave de licença" e clique em Ativar.`;
  window.open('https://wa.me/?text=' + encodeURIComponent(texto), '_blank');
};

/* ---------- Histórico ---------- */
function lerHistorico() {
  try { return JSON.parse(localStorage.getItem(STORE_HIST) || '[]'); } catch { return []; }
}
function salvarHistorico(item) {
  const h = lerHistorico();
  h.unshift(item);
  localStorage.setItem(STORE_HIST, JSON.stringify(h.slice(0, 30)));
  render();
}
function render() {
  const h = lerHistorico();
  $('qtd').textContent = h.length;
  $('lista').innerHTML = h.map((x, i) => `
    <li>
      <div><b>${x.produtoNome}</b> · ${x.plano}</div>
      <div class="quando">${new Date(x.em).toLocaleString('pt-BR')} · vence ${new Date(x.exp).toLocaleDateString('pt-BR')}</div>
      <code>…${x.hwid.slice(-16)}</code><br>
      <button class="sec" data-i="${i}" data-a="copiar">Copiar chave</button>
      <button class="sec" data-i="${i}" data-a="zap">WhatsApp</button>
    </li>`).join('') || '<li class="quando">Nenhuma chave emitida ainda.</li>';
}
$('lista').onclick = e => {
  const b = e.target.closest('button[data-i]');
  if (!b) return;
  const item = lerHistorico()[+b.dataset.i];
  if (!item) return;
  if (b.dataset.a === 'copiar') copiar(item.chave, b);
  else window.open('https://wa.me/?text=' + encodeURIComponent(
    `Chave de licença do ${item.produtoNome}\nPlano: ${item.plano}\n\n${item.chave}`), '_blank');
};
$('limpar').onclick = () => {
  if (confirm('Apagar o histórico de chaves emitidas deste aparelho?')) {
    localStorage.removeItem(STORE_HIST); render();
  }
};

/* ---------- Início ---------- */
const params = new URLSearchParams(location.search);
if (params.get('p') && PRODUTOS[params.get('p').toLowerCase()]) setProduto(params.get('p').toLowerCase());
else setProduto('aquagest');
if (params.get('hw')) {
  $('hw').value = params.get('hw');
  // Veio do QR da tela de ativação: já abre pronto para gerar.
  history.replaceState(null, '', location.pathname);
}
render();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
